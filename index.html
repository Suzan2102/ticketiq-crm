<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TicketIQ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: #f4f6fa;
      color: #222;
    }
    header {
      background: #0b2545;
      color: #fff;
      padding: 18px 32px;
    }
    header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
    main { max-width: 1000px; margin: 30px auto; padding: 0 16px; }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 24px;
    }
    h2 { margin-top: 0; color: #0b2545; font-size: 20px; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
    label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; flex: 1; min-width: 160px; }
    input, select {
      padding: 9px 10px;
      border: 1px solid #ccd3dd;
      border-radius: 6px;
      font-size: 15px;
      font-family: inherit;
    }
    button {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-add { background: #0b2545; color: #fff; }
    .btn-add:hover { background: #13315c; }
    .btn-close { background: #2e7d32; color: #fff; padding: 6px 12px; font-size: 14px; }
    .btn-close:hover { background: #1b5e20; }
    .btn-close:disabled { background: #9e9e9e; cursor: default; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid #e3e7ee; }
    th { background: #eef1f6; color: #0b2545; font-weight: 600; }
    tr.priority-high td { background: #ffe0e0; }
    tr.priority-medium td { background: #ffecd1; }
    tr.priority-low td { background: #e0f5e0; }
    .msg { padding: 10px; color: #555; text-align: center; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <header>
    <h1>TicketIQ</h1>
  </header>

  <main>
    <section class="card">
      <h2>פנייה חדשה</h2>
      <form id="ticket-form">
        <label>
          שם לקוח
          <input type="text" id="customer_name" required>
        </label>
        <label>
          נושא
          <input type="text" id="subject" required>
        </label>
        <label>
          עדיפות
          <select id="priority">
            <option value="גבוהה">גבוהה</option>
            <option value="בינונית" selected>בינונית</option>
            <option value="נמוכה">נמוכה</option>
          </select>
        </label>
        <button type="submit" class="btn-add">הוסף</button>
      </form>
    </section>

    <section class="card">
      <h2>פניות</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>שם לקוח</th>
            <th>נושא</th>
            <th>עדיפות</th>
            <th>סטטוס</th>
            <th>נוצר</th>
            <th>פעולה</th>
          </tr>
        </thead>
        <tbody id="tickets-body">
          <tr><td colspan="7" class="msg">טוען...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const priorityClass = {
      'גבוהה': 'priority-high',
      'בינונית': 'priority-medium',
      'נמוכה': 'priority-low'
    };

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function loadTickets() {
      const tbody = document.getElementById('tickets-body');
      const { data, error } = await db
        .from('tickets')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="7" class="msg error">שגיאה בטעינה: ${escapeHtml(error.message)}</td></tr>`;
        return;
      }
      if (!data.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="msg">אין פניות עדיין</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(t => {
        const closed = t.status === 'סגור';
        const created = t.created_at ? new Date(t.created_at).toLocaleString('he-IL') : '';
        return `
          <tr class="${priorityClass[t.priority] || ''}">
            <td>${escapeHtml(t.id)}</td>
            <td>${escapeHtml(t.customer_name)}</td>
            <td>${escapeHtml(t.subject)}</td>
            <td>${escapeHtml(t.priority)}</td>
            <td>${escapeHtml(t.status)}</td>
            <td>${escapeHtml(created)}</td>
            <td><button class="btn-close" data-id="${escapeHtml(t.id)}" ${closed ? 'disabled' : ''}>✓ סגור</button></td>
          </tr>`;
      }).join('');
    }

    async function addTicket(e) {
      e.preventDefault();
      const ticket = {
        customer_name: document.getElementById('customer_name').value.trim(),
        subject: document.getElementById('subject').value.trim(),
        priority: document.getElementById('priority').value,
        status: 'פתוח'
      };
      const { error } = await db.from('tickets').insert(ticket);
      if (error) {
        alert('שגיאה בהוספה: ' + error.message);
        return;
      }
      e.target.reset();
      loadTickets();
    }

    async function closeTicket(id) {
      const { error } = await db.from('tickets').update({ status: 'סגור' }).eq('id', id);
      if (error) {
        alert('שגיאה בעדכון: ' + error.message);
        return;
      }
      loadTickets();
    }

    document.getElementById('ticket-form').addEventListener('submit', addTicket);
    document.getElementById('tickets-body').addEventListener('click', e => {
      const btn = e.target.closest('.btn-close');
      if (btn) closeTicket(btn.dataset.id);
    });

    loadTickets();
  </script>
</body>
</html>
